name: AnyThings World - daily video (YouTube)

on:
  schedule:
    # 06:00 UTC daily — edit to taste. This is the entire "automation" —
    # once this file is on GitHub with the secrets below set, nothing
    # further is required from you.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you also trigger a run manually from the Actions tab (or the CYE app)

jobs:
  youtube:
    uses: ./.github/workflows/produce-video.yml
    with:
      platform: youtube
      long_form_every_n: "4"
    secrets: inherit
