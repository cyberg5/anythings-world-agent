name: AnyThings World - daily video

on:
  schedule:
    # 06:00 UTC daily — edit to taste. This is the entire "automation" —
    # once this file is on GitHub with the secrets below set, nothing
    # further is required from you.
    - cron: "47 6 * * *"
  workflow_dispatch: {} # lets you also trigger a run manually from the Actions tab

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Piper TTS (local, free, offline — no API key)
        run: |
          pip install --user piper-tts --break-system-packages
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Piper voice model
        # Must match TTS_VOICE (default en_US-lessac-medium) and the
        # PIPER_DATA_DIR path in src/services/tts.ts. Newer piper-tts no
        # longer auto-downloads on first use, so this step is required —
        # skipping it fails with "Unable to find voice".
        run: |
          python3 -m piper.download_voices en_US-lessac-medium \
            --download-dir "$HOME/.local/share/piper-voices"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run pipeline
        env:
          CHANNEL_NAME: "AnyThings World™"
          CHANNEL_HANDLE: "@Any-Future7"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEOS_PER_RUN: "1"
          LONG_FORM_EVERY_N: "4"
        run: npm run run:once
