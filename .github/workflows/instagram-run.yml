name: AnyThings World - daily video (Instagram)

on:
  schedule:
    # 12:00 UTC daily — offset from YouTube/TikTok so runs don't overlap.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  instagram:
    # Scheduled runs are skipped until you create the repo VARIABLE INSTAGRAM_ENABLED=true
    # (Settings -> Secrets and variables -> Actions -> Variables), so this
    # doesn't fail daily before its keys exist. Manual/app triggers always run.
    if: github.event_name == 'workflow_dispatch' || vars.INSTAGRAM_ENABLED == 'true'
    uses: ./.github/workflows/produce-video.yml
    with:
      platform: instagram
      long_form_every_n: "0" # always vertical short-form (Reels)
    secrets: inherit
